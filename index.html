<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>80s Forever – Deine Erinnerung. Neu erlebt.</title><style>body{margin:0;font-family:Arial,sans-serif;background:#10051b;color:#fff}main{max-width:900px;margin:auto;padding:40px 20px}h1{font-size:52px;margin:20px 0 8px}h2{color:#ff4fd8}.card{background:#1d0b2b;border:1px solid #7d3b9b;border-radius:18px;padding:24px;margin:20px 0}label{display:block;margin:14px 0 7px}input,select,button{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:0;font-size:16px}button{margin-top:18px;background:#ff4fd8;color:#14051d;font-weight:bold;cursor:pointer}.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.style{padding:18px;border:1px solid #7d3b9b;border-radius:12px}.small{opacity:.75}.price{font-size:28px;font-weight:bold}@media(max-width:700px){h1{font-size:38px}.styles{grid-template-columns:1fr}}</style></head><body><main><div class="small">80s FOREVER</div><h1>Dein Foto. Die 80er.</h1><h2>Deine Erinnerung. Neu erlebt.</h2><p>Wir verwandeln dein Foto mit KI in einen persönlichen 80er-Jahre-Look.</p><div class="styles"><div class="style"><b>Neon 80s</b><br>Neon, Nacht & Retro-Glow</div><div class="style"><b>Arcade 80s</b><br>Spielhalle & Pixel-Atmosphäre</div><div class="style"><b>Retro Magazine</b><br>80er-Fashion & Magazin-Look</div></div><div class="card"><div class="price">3 KI-Bilder – 9,90 €</div><form id="f"><label>E-Mail</label><input name="email" type="email" required placeholder="deine@email.at"><label>Stil</label><select name="style"><option value="neon">Neon 80s</option><option value="arcade">Arcade 80s</option><option value="magazine">Retro Magazine</option></select><label>Foto</label><input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required><button>Weiter zur sicheren Zahlung</button></form><p id="msg" class="small"></p></div></main><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent='Bitte warten …';const r=await fetch('/api/create-checkout',{method:'POST',body:new FormData(f)});const j=await r.json();if(j.url)location.href=j.url;else msg.textContent=j.error||'Fehler'};</script></body></html>
