
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>80s Forever – Dein Foto. Die 80er.</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 14px;background:#10091d;color:#fff;font-family:Arial,sans-serif}
main{max-width:620px;margin:auto;padding:26px 20px;background:#1b1230;border:1px solid #653d87;border-radius:20px;box-shadow:0 0 28px #a000ff35}
h1{text-align:center;color:#ff55d9;text-shadow:0 0 16px #ff00cc;font-size:36px}
h2{text-align:center;color:#55f5ff}
p{text-align:center;line-height:1.6;color:#e4d8f5}
label{display:block;margin-top:18px;margin-bottom:8px}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #9a68bc;background:#10091d;color:white}
.styles{display:grid;grid-template-columns:1fr;gap:10px}
.style{padding:13px;border:1px solid #70458d;border-radius:12px;background:#241637}
button{width:100%;padding:15px;margin-top:20px;border:0;border-radius:12px;background:linear-gradient(90deg,#ff36ca,#783cff,#00dff5);color:white;font-size:17px;font-weight:bold}
.preview-wrap{display:none;margin-top:16px;text-align:center}
#preview{max-width:100%;max-height:380px;border-radius:12px;border:2px solid #55f5ff}
#status{margin-top:14px;color:#55f5ff;text-align:center}
.small{font-size:12px;color:#c5b3d9}
</style>
</head>
<body>
<main>
<h1>80s FOREVER</h1>
<h2>Dein Foto. Die 80er.</h2>
<p>Deine Erinnerung. Neu erlebt.<br>
Wir verwandeln dein Foto mit KI in einen persönlichen 80er-Jahre-Look.</p>

<form id="photoForm">
<label>Wähle deinen 80er-Jahre-Stil</label>
<div class="styles">
<label class="style"><input type="radio" name="style" value="Neon 80s" checked> Neon 80s – Neon, Nacht & Retro-Glow</label>
<label class="style"><input type="radio" name="style" value="Arcade 80s"> Arcade 80s – Spielhalle & Pixel-Atmosphäre</label>
<label class="style"><input type="radio" name="style" value="Retro Magazine"> Retro Magazine – 80er-Fashion & Magazin-Look</label>
</div>

<label for="email">Deine E-Mail-Adresse</label>
<input id="email" type="email" placeholder="deine@email.at" required>

<label for="photo">Wähle dein Foto</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp" required>

<div class="preview-wrap" id="previewWrap">
<p>Deine Foto-Vorschau:</p>
<img id="preview" alt="Vorschau deines ausgewählten Fotos">
</div>

<p><strong>3 KI-Bilder – 9,90 €</strong></p>
<button type="submit">Weiter zur sicheren Zahlung</button>
<p class="small">Dein Foto wird hier zunächst nur in deinem Browser angezeigt.</p>
</form>
<div id="status" role="status"></div>
</main>

<script>
const photoInput = document.getElementById('photo');
const preview = document.getElementById('preview');
const previewWrap = document.getElementById('previewWrap');
const statusBox = document.getElementById('status');
let previewUrl = null;

photoInput.addEventListener('change', function () {
  const file = this.files && this.files[0];
  statusBox.textContent = '';
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = null;
  if (!file) {
    previewWrap.style.display = 'none';
    preview.removeAttribute('src');
    return;
  }
  if (!['image/jpeg','image/png','image/webp'].includes(file.type)) {
    this.value = '';
    previewWrap.style.display = 'none';
    statusBox.textContent = 'Bitte wähle ein JPG-, PNG- oder WebP-Bild.';
    return;
  }
  previewUrl = URL.createObjectURL(file);
  preview.src = previewUrl;
  previewWrap.style.display = 'block';
});

document.getElementById('photoForm').addEventListener('submit', function (event) {
  event.preventDefault();
  statusBox.textContent = 'Die Foto-Vorschau funktioniert. KI-Bilderzeugung und Zahlung sind noch nicht angeschlossen.';
});
</script>
</body>
     </html>
