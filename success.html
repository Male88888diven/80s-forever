<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>80s Forever – Bestellung</title></head><body style="font-family:Arial;max-width:800px;margin:40px auto;padding:20px"><h1>Danke! 🎉</h1><p id="s">Wir prüfen deine Zahlung und erstellen deine 3 Bilder.</p><div id="images"></div><script>const id=new URLSearchParams(location.search).get('order_id');async function poll(){if(!id)return;const r=await fetch('/api/order/'+id);const j=await r.json();if(j.status==='completed'){s.textContent='Fertig! Hier kannst du deine Bilder öffnen:';images.innerHTML=j.images.map((x,i)=>`<p><a href="${x}" target="_blank">Bild ${i+1} öffnen</a></p>`).join('');}else if(j.status==='error'){s.textContent='Leider ist ein Fehler aufgetreten: '+(j.error||'unbekannt');}else setTimeout(poll,3000)}poll();</script></body></html>
